<script>
    document.getElementById('portal-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('input-email').value;
        const password = document.getElementById('input-password').value;
        const statusBox = document.getElementById('status-box');
        const submitBtn = document.getElementById('submit-btn');

        submitBtn.innerText = "Processing...";
        submitBtn.disabled = true;
        statusBox.style.display = "none";

        try {
            const response = await fetch('/api/unlock', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, password: password })
            });

            // Read raw response text first to debug if Vercel crashes
            const responseText = await response.text();
            let data = {};
            try {
                data = JSON.parse(responseText);
            } catch(e) {
                throw new Error(responseText || "Server crashed without JSON response");
            }

            if (response.ok && data.success) {
                statusBox.className = "status-msg success";
                statusBox.innerText = "Verification successful. Connecting to secure file server...";
                statusBox.style.display = "block";
            } else {
                statusBox.className = "status-msg error";
                statusBox.innerText = data.error || "An authentication error occurred.";
                statusBox.style.display = "block";
                submitBtn.innerText = "Unlock Document";
                submitBtn.disabled = false;
            }
        } catch (err) {
            statusBox.className = "status-msg error";
            statusBox.innerText = err.message || "Gateway timeout. Server response unreadable.";
            statusBox.style.display = "block";
            submitBtn.innerText = "Unlock Document";
            submitBtn.disabled = false;
        }
    });
</script>
